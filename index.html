<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Sass/style.css">
</head>

<body>
    <div class="wrap">
        <h1>PostWork-Form</h1>
        <form action="">
            <div>
                <label for="first Name">First Name</label> <br>
                <input class="input" type="text" placeholder="Your first Name" required><br>
            </div>
            <div>
                <label for="middle Name">Middle Name</label> <br>
                <input class="input" type="text" placeholder="Your Middle Name" required> <br>
            </div>
            <div>
                <label for="last Name">Last Name</label> <br>
                <input class="input" type="text" placeholder="Your Last Name" required> <br>
            </div>
            <div>
                <label for="password">Password</label> <br>
                <input class="input" type="password" name="" id="" placeholder="Password" required> <br>
            </div>
            <div>
                <label for="email">Email</label> <br>
                <input class="input" type="text" placeholder="Email" required> <br>
            </div>
            <div>
                <button>Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
